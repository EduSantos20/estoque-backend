spring.application.name=estoque-chuteiras

# ---- Banco de dados PostgreSQL ----
spring.datasource.url=jdbc:postgresql://localhost:5432/estoque_chuteiras
spring.datasource.username=postgres
spring.datasource.password=0131
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# update: cria/atualiza tabelas automaticamente a partir das entidades.
# Em producao prefira usar o schema.sql do /database e trocar para "validate".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---- Servidor ----
server.port=8080

# ---- JWT ----
# IMPORTANTE: troque este segredo em producao (minimo 32 caracteres)
app.jwt.secret=troque-esta-chave-secreta-para-producao-com-32-chars-no-minimo
app.jwt.expiration-ms=28800000

# ---- Configuracao inicial do negocio ----
app.estoque.meta-padrao=10
app.estoque.tamanho-min=34
app.estoque.tamanho-max=43

# ---- CORS (endereco do frontend Vite) ----
app.cors.allowed-origin=http://localhost:5173
